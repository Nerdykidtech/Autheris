<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="art.css">
<style>
  /* 1920x823 CSS px, rendered at 2x = 3840x1646 */
  h1 { position: absolute; left: 0; right: 0; top: 70px; text-align: center; font-size: 76px; }
  .phone { width: 400px; left: calc(50% - 200px); top: 200px; }
  .watch { width: 230px; left: calc(50% + 250px); top: 330px; }
  .ring.a { width: 760px; height: 760px; }
  .ring.b { width: 1180px; height: 1180px; }
</style></head>
<body>
  <div class="spokes"><i></i><i></i><i></i></div>
  <div class="ring a"></div><div class="ring b"></div>
  <h1>Every 2FA code, one tap away.</h1>
  <div class="phone"><img src="phone.png"></div>
  <div class="watch"><img src="watch.png"></div>
</body></html>
